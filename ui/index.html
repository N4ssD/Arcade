<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&#x2800;</title>
  <meta name="theme-color" content="#121218" />
  <link rel="preload" href="fonts/silkscreen-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/outfit-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/outfit-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/png" sizes="38x38" href="icon-38.png" />
  <link rel="icon" type="image/png" sizes="76x76" href="icon-76.png" />
  <link rel="icon" type="image/png" sizes="152x152" href="icon-152.png" />
  <link rel="icon" type="image/png" sizes="304x304" href="icon-304.png" />
  <style>html,body{background:#121218}</style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="preload booting">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="arc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-a,#c9b8f8)"/><stop offset="1" style="stop-color:var(--logo-b,#7b56d4)"/></linearGradient><symbol id="arc-logo" viewBox="0 0 19 19"><rect width="19" height="19" rx="4.2" fill="url(#arc-g)" stroke="none"/><path fill="var(--logo-ink,#1e1828)" stroke="none" shape-rendering="crispEdges" d="M9 3h1v1h-1zM9 4h1v1h-1zM8 5h3v1h-3zM8 6h3v1h-3zM7 7h5v1h-5zM5 8h9v1h-9zM3 9h13v1h-13zM5 10h9v1h-9zM7 11h5v1h-5zM8 12h3v1h-3zM8 13h3v1h-3zM9 14h1v1h-1zM9 15h1v1h-1z"/></symbol></defs></svg>
  <div id="bgfx" aria-hidden="true"><i class="bg-glow g1"></i><i class="bg-glow g2"></i><i class="bg-grid"></i><i class="bg-scan"></i></div>
  <div id="sig" aria-hidden="true">N4ssD</div>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-glow"></div>
    <div class="splash-grid"></div>
    <span class="px" style="--x:158px;--y:226px;--s:6px;--d:0.32s"></span>
    <span class="px" style="--x:-213px;--y:-189px;--s:6px;--d:0.26s"></span>
    <span class="px" style="--x:227px;--y:-121px;--s:6px;--d:1.08s"></span>
    <span class="px" style="--x:-264px;--y:-117px;--s:6px;--d:1.12s"></span>
    <span class="px" style="--x:132px;--y:-71px;--s:6px;--d:0.66s"></span>
    <span class="px" style="--x:-258px;--y:-206px;--s:8px;--d:1.1s"></span>
    <span class="px" style="--x:-146px;--y:-155px;--s:6px;--d:1.08s"></span>
    <span class="px" style="--x:-264px;--y:-218px;--s:6px;--d:0.99s"></span>
    <span class="px" style="--x:318px;--y:179px;--s:10px;--d:0.78s"></span>
    <span class="px" style="--x:-323px;--y:-122px;--s:6px;--d:1.12s"></span>
    <span class="px" style="--x:207px;--y:133px;--s:6px;--d:0.39s"></span>
    <span class="px" style="--x:162px;--y:98px;--s:10px;--d:0.87s"></span>
    <span class="px" style="--x:-315px;--y:147px;--s:8px;--d:1.15s"></span>
    <span class="px" style="--x:137px;--y:-129px;--s:10px;--d:1.32s"></span>
    <div class="splash-center">
      <div class="splash-logo-wrap">
        <div class="splash-logo"><svg viewBox="0 0 19 19"><use href="#arc-logo"/></svg></div>
      </div>
      <div class="splash-word"><span style="--i:0">A</span><span style="--i:1">R</span><span style="--i:2">C</span><span style="--i:3">A</span><span style="--i:4">D</span><span style="--i:5">E</span></div>
      <div class="splash-tag">Ta bibliothèque de jeux</div>
      <div class="splash-bar"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i></div>
      <div class="splash-status" id="splash-status">Chargement…</div>
    </div>
    <div class="splash-hint">Appuie sur une touche pour passer</div>
  </div>
  <div class="titlebar"><span class="titlebar-title">Arcade</span></div>

  <div class="app">
    <div id="ambient" aria-hidden="true"><i></i><i></i></div>
    <div id="ambient-cap" aria-hidden="true"></div>
    <aside class="sidebar">
      <div class="brand">
        <button class="brand-btn" id="btn-brand" data-snd="none" title="Agrandir le menu" aria-label="Agrandir le menu">
          <svg viewBox="0 0 19 19" class="brand-logo" aria-hidden="true"><use href="#arc-logo"/></svg>
        </button>
        <span class="brand-name">ARCADE</span>
        <button class="side-toggle" id="btn-collapse" data-snd="none" title="Réduire le menu (Ctrl+B)" aria-label="Réduire le menu">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item av-nav" id="btn-avatar" data-snd="nav" title="Mon avatar" hidden>
          <i class="av-ic"></i>
          <span>Mon avatar</span><em id="av-lv"></em>
        </button>
        <button class="nav-item active" data-view="all" title="Bibliothèque">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>Bibliothèque</span><em id="count-all">0</em>
        </button>
        <button class="nav-item" data-view="fav" title="Favoris">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
          <span>Favoris</span><em id="count-fav">0</em>
        </button>
        <button class="nav-item" data-view="recent" title="Récents">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Récents</span>
        </button>
        <button class="nav-item" data-view="stats" title="Statistiques">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Statistiques</span>
        </button>
      </nav>

      <div class="side-title" id="cat-title" hidden>Catégories</div>
      <nav class="nav cats" id="cats"></nav>

      <div class="side-bottom">
        <button class="nav-item" id="btn-ach" data-snd="nav" title="Succès">
          <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5A3 3 0 0 1 16 10.5M12 13v4M8.5 20h7M10 17h4"/></svg>
          <span>Succès</span><em class="ach-count" id="ach-count"></em>
        </button>
        <button class="nav-item" id="btn-news" data-snd="nav" title="Nouveautés">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
          <span>Nouveautés</span><i class="news-dot" id="news-dot" hidden></i>
        </button>
        <button class="nav-item" id="btn-settings" data-view="settings" data-snd="nav" title="Paramètres">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Paramètres</span>
        </button>
        <button class="btn primary block" id="btn-add" title="Ajouter un jeu (Ctrl+N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter un jeu</span>
        </button>
        <button class="btn ghost block" id="btn-scan" title="Scanner un dossier">
          <svg viewBox="0 0 24 24"><path d="M11 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v3"/><circle cx="17" cy="17" r="3"/><path d="M21 21l-1.6-1.6"/></svg><span>Scanner un dossier</span>
        </button>
        <button class="btn ghost block" id="btn-import" title="Importer les jeux installés depuis Steam, Epic Games et GOG">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Importer mes jeux</span>
        </button>
        <div class="perf-chip" id="perf-chip" hidden><i class="pc-dot"></i><span id="perf-chip-t"></span></div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Rechercher… (Ctrl+F)" autocomplete="off" />
        </div>
        <select id="sort" title="Trier par">
          <option value="name">Nom (A–Z)</option>
          <option value="recent">Dernier lancé</option>
          <option value="playtime">Temps de jeu</option>
          <option value="added">Ajouté récemment</option>
        </select>
        <button class="btn ghost" id="btn-cats" title="Créer et gérer les catégories (Jeux, Logiciels…)">
          <svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></svg><span>Catégories</span>
        </button>
        <button class="btn ghost" id="btn-lucky" title="Laisse le hasard choisir ton prochain jeu">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/></svg><span>Surprends-moi</span>
        </button>
        <button class="btn ghost icon-only" id="btn-full" title="Plein écran (F11)" data-snd="none">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <label class="size" title="Taille des vignettes">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          <input id="size" type="range" min="140" max="320" step="20" />
          <span id="size-val" class="size-val"></span>
        </label>
      </header>

      <aside class="av-strip" id="av-panel" hidden></aside>

      <div class="chips" id="chips" hidden></div>

      <h1 class="view-title" id="view-title">Bibliothèque</h1>
      <section class="grid" id="grid"></section>

      <section class="settings" id="settings" hidden></section>
      <section class="stats" id="stats" hidden></section>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 19 19" class="empty-logo" aria-hidden="true"><use href="#arc-logo"/></svg>
        <h2 id="empty-title">Ta bibliothèque est vide</h2>
        <p id="empty-text">Ajoute un jeu, scanne un dossier, ou glisse-dépose tes fichiers ici.</p>
        <button class="btn primary" id="btn-add-empty">Ajouter un jeu</button>
        <button class="btn" id="btn-import-empty">Importer Steam / Epic / GOG</button>
      </div>
    </main>
  </div>

  <div class="dropzone" id="dropzone"><div>Dépose tes raccourcis (.lnk, .url) ici</div></div>
  <div class="toasts" id="toasts"></div>
  <div class="ctx" id="ctx" hidden></div>
  <div class="modal-root" id="modal-root" hidden></div>

  <script src="i18n.js"></script>
  <script src="sounds.js"></script>
  <script src="bridge.js"></script>
  <script src="avatar.js"></script>
  <script src="app-core.js"></script>
  <script src="app-library.js"></script>
  <script src="app-views.js"></script>
  <script src="app-achievements.js"></script>
  <script src="app-avatar.js"></script>
  <script src="app-news.js"></script>
  <script src="app-categories.js"></script>
  <script src="app-import.js"></script>
  <script src="app-settings.js"></script>
  <script src="app-main.js"></script>
</body>
</html>
