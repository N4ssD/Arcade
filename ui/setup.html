<!doctype html>
<html lang="fr">
<head>
<style>html,body{background:#121218}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installation d'Arcade</title>
<style>
@font-face { font-family: "Silkscreen"; font-weight: 400; src: url("fonts/silkscreen-400.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Silkscreen"; font-weight: 700; src: url("fonts/silkscreen-700.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Outfit"; font-weight: 400; src: url("fonts/outfit-400.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Outfit"; font-weight: 600; src: url("fonts/outfit-600.woff2") format("woff2"); font-display: block; }
:root { --bg:#121218; --card:#1E1E28; --text:#ECECF1; --muted:#9A9AAE; --line:#3A3A48; --accent:#9C7CF0; --accent-2:#BBA3FF; --accent-3:#7A59D3; --ok:#5DD39E; --ease:cubic-bezier(.2,.8,.2,1); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "Outfit", system-ui, sans-serif; font-size: 15px; overflow: hidden; display: grid; place-items: center; user-select: none; cursor: default; }
.px-font { font-family: "Silkscreen", monospace; text-transform: uppercase; letter-spacing: 1.5px; }
/* fond */
.bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; filter: blur(10px); }
.glow.a { left: -180px; top: -240px; background: radial-gradient(circle, rgba(156,124,240,.30), transparent 66%); animation: d1 24s ease-in-out infinite alternate; }
.glow.b { right: -220px; bottom: -280px; background: radial-gradient(circle, rgba(122,89,211,.30), transparent 66%); animation: d2 30s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(160px, 110px) scale(1.1); } }
@keyframes d2 { to { transform: translate(-180px, -100px) scale(1.1); } }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 28px 28px; animation: g 40s linear infinite; }
@keyframes g { to { background-position: 28px 56px; } }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); opacity: .35; mix-blend-mode: multiply; }
.p { position: absolute; background: #C9B8F8; opacity: 0; animation: blink 1.3s steps(2, end) var(--d) infinite; }
@keyframes blink { 0% { opacity: 0; } 50% { opacity: .9; } 100% { opacity: 0; } }
/* carte */
.card { position: relative; width: min(600px, calc(100vw - 48px)); padding: 34px 36px 30px; border-radius: 24px; background: rgba(30,30,40,.86); border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03) inset; backdrop-filter: blur(14px); animation: cin .6s var(--ease) both; }
@keyframes cin { from { opacity: 0; transform: translateY(16px) scale(.985); } }
.head { display: flex; align-items: center; gap: 18px; }
.logo { width: 64px; height: 64px; border-radius: 16px; flex: none; box-shadow: 0 14px 40px -8px rgba(122,89,211,.8); }
h1 { margin: 0; font-family: "Silkscreen", monospace; font-weight: 700; font-size: 32px; letter-spacing: 6px; line-height: 1.1; color: #F1EDFF; text-transform: uppercase; }
.ver { font-family: "Silkscreen", monospace; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
.lead { margin: 22px 0 22px; color: #C4C4D4; font-size: 16px; line-height: 1.45; }
.label { font-family: "Silkscreen", monospace; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
.where { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.where .t { flex: 1; min-width: 0; }
.path { margin-top: 6px; font-size: 14px; color: var(--text); overflow-wrap: anywhere; user-select: text; line-height: 1.35; }
.hint { margin-top: 4px; font-size: 13px; color: var(--muted); }
.btn { font-family: "Silkscreen", monospace; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; font-weight: 400; color: var(--text); background: rgba(18,18,24,.6); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; cursor: pointer; transition: transform .12s var(--ease), background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: rgba(156,124,240,.16); border-color: rgba(156,124,240,.6); }
.btn:active { transform: scale(.95); }
.btn.primary { background: linear-gradient(180deg, #A98CF5, #8C6BE6); border-color: transparent; color: #17131f; font-weight: 700; padding: 14px 30px; font-size: 13px; box-shadow: 0 12px 34px -8px rgba(156,124,240,.65); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.opts { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 9px 0; cursor: pointer; }
.opt span { font-size: 15px; }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 99px; background: #3A3A48; transition: background .2s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .22s var(--ease); }
.sw input:checked + i { background: var(--accent); }
.sw input:checked + i::after { transform: translateX(18px); }
.sw input:focus-visible + i { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.foot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
[hidden] { display: none !important; }
.view { display: none; }
.view.on { display: block; animation: cin .45s var(--ease) both; }
/* progression */
.bar { height: 10px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin: 26px 0 14px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #BBA3FF, #7A59D3); box-shadow: 0 0 16px rgba(156,124,240,.9); transition: width .45s steps(12, end); }
.status { color: var(--muted); font-size: 14px; min-height: 20px; }
.done { text-align: center; padding: 6px 0 2px; }
.done .ok { width: 72px; height: 72px; border-radius: 20px; margin: 4px auto 16px; display: grid; place-items: center; background: rgba(93,211,158,.14); border: 1px solid rgba(93,211,158,.5); color: var(--ok); animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
.done .ok svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
.done h2 { font-family: "Silkscreen", monospace; font-weight: 700; font-size: 20px; letter-spacing: 3px; margin: 0 0 8px; text-transform: uppercase; }
.done p { margin: 0 0 22px; color: #C4C4D4; }
.err { color: #FF7A8A; margin: 0 0 18px; font-size: 14px; }
#sig { position: fixed; right: 16px; bottom: 8px; font-family: "Silkscreen", monospace; font-size: 12px; letter-spacing: 2px; color: var(--muted); opacity: .5; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .p { opacity: .3; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9B8F8"/><stop offset="1" stop-color="#7B56D4"/></linearGradient><symbol id="logo" viewBox="0 0 19 19"><rect width="19" height="19" rx="4.2" fill="url(#g)"/><path fill="#1E1828" shape-rendering="crispEdges" d="M9 3h1v1h-1zM9 4h1v1h-1zM8 5h3v1h-3zM8 6h3v1h-3zM7 7h5v1h-5zM5 8h9v1h-9zM3 9h13v1h-13zM5 10h9v1h-9zM7 11h5v1h-5zM8 12h3v1h-3zM8 13h3v1h-3zM9 14h1v1h-1zM9 15h1v1h-1z"/></symbol></defs></svg>
<div class="bg" id="bg"><i class="glow a"></i><i class="glow b"></i><i class="grid"></i><i class="scan"></i></div>

<main class="card">
  <div class="head">
    <svg class="logo" viewBox="0 0 19 19"><use href="#logo"/></svg>
    <div><h1>Arcade</h1><div class="ver" id="ver"></div></div>
  </div>

  <section class="view on" id="v-ask">
    <p class="lead" id="lead">Installe Arcade pour ce compte. Aucun administrateur requis.</p>
    <div class="where">
      <div class="t"><div class="label" id="where-l">Installer dans</div><div class="path" id="path">…</div><div class="hint" id="hint">C'est toi qui choisis où installer Arcade.</div></div>
      <button class="btn" id="b-browse" type="button">Modifier…</button>
    </div>
    <div class="opts">
      <label class="opt"><span class="sw"><input type="checkbox" id="o-desk" checked><i></i></span><span>Raccourci sur le Bureau</span></label>
      <label class="opt"><span class="sw"><input type="checkbox" id="o-start" checked><i></i></span><span>Raccourci dans le menu Démarrer</span></label>
      <label class="opt"><span class="sw"><input type="checkbox" id="o-run" checked><i></i></span><span>Lancer Arcade à la fin</span></label>
    </div>
    <div class="foot"><button class="btn primary" id="b-go" type="button">Installer</button></div>
  </section>

  <section class="view" id="v-prog">
    <p class="lead" id="prog-t">Installation en cours…</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status">Préparation…</div>
    <p class="err" id="err" hidden></p>
    <div class="foot" id="err-foot" hidden><button class="btn" id="b-back" type="button">Retour</button><button class="btn primary" id="b-retry" type="button">Réessayer</button></div>
  </section>

  <section class="view" id="v-done">
    <div class="done">
      <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="done-t">Arcade est installé</h2>
      <p id="done-p">Tout est prêt. Bon jeu !</p>
      <button class="btn primary" id="b-end" type="button">Lancer Arcade</button>
    </div>
  </section>
</main>
<div id="sig">N4ssD</div>

<script src="i18n.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const api = (p, body) => window.__TAURI__.core.invoke('setup', { name: p, body: body || {} });
  const show = (id) => document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === id));
  let info = {}, working = false;

  // petits pixels qui scintillent (comme dans Arcade)
  const bg = $('bg');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('i'); p.className = 'p';
    const s = [6, 6, 6, 8, 10][Math.floor(Math.random() * 5)];
    p.style.cssText = `left:${(Math.random() * 98).toFixed(1)}%;top:${(Math.random() * 96).toFixed(1)}%;width:${s}px;height:${s}px;--d:${(Math.random() * 2.6).toFixed(2)}s`;
    bg.appendChild(p);
  }


  api('info').then((i) => {
    info = i;
    $('ver').textContent = 'Version ' + i.version;
    $('path').textContent = i.dir;
    if (i.mode === 'update') {
      $('lead').textContent = 'Une nouvelle version d\'Arcade est prête' + (i.oldVersion ? ' (' + i.oldVersion + ' → ' + i.version + ')' : '') + '. Ta bibliothèque et tes réglages sont conservés.';
      $('where-l').textContent = 'Installé dans';
      $('b-browse').hidden = true; $('hint').hidden = true;
      $('b-go').textContent = 'Mettre à jour';
      $('prog-t').textContent = 'Mise à jour en cours…';
      $('done-t').textContent = 'Arcade est à jour';
    }
  });

  $('b-browse').onclick = async () => {
    const r = await api('browse'); if (r.dir) $('path').textContent = r.dir;
  };

  const steps = ['Copie des fichiers…', 'Création des raccourcis…', 'Finalisation…'];
  async function run() {
    if (working) return; working = true;
    show('v-prog'); $('err').hidden = true; $('err-foot').hidden = true;
    const bar = $('bar'); bar.style.width = '6%'; $('status').textContent = steps[0];
    let k = 0; const t = setInterval(() => { k = Math.min(k + 1, steps.length - 1); $('status').textContent = steps[k]; bar.style.width = (6 + (k + 1) * 28) + '%'; }, 300);
    const t0 = Date.now();
    let r;
    try { r = await api('install', { desktop: $('o-desk').checked, start: $('o-start').checked }); } catch (e) { r = { ok: false, error: 'L\'installeur ne répond plus.' }; }
    const wait = Math.max(0, 800 - (Date.now() - t0));
    await new Promise((res) => setTimeout(res, wait));
    clearInterval(t); working = false;
    if (!r.ok) { $('status').textContent = ''; $('err').textContent = r.error || 'Erreur inconnue.'; $('err').hidden = false; $('err-foot').hidden = false; bar.style.width = '0'; return; }
    bar.style.width = '100%';
    await new Promise((res) => setTimeout(res, 450));
    const run = $('o-run').checked;
    $('b-end').textContent = run ? 'Lancer Arcade' : 'Fermer';
    $('done-p').textContent = run ? 'Tout est prêt. Bon jeu !' : 'Tu peux le retrouver avec son raccourci.';
    show('v-done');
  }
  $('b-go').onclick = run;
  $('b-retry').onclick = run;
  $('b-back').onclick = () => show('v-ask');
  $('b-end').onclick = async () => { $('b-end').disabled = true; try { await api('finish', { launch: $('o-run').checked }); } catch (e) {} };
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && $('v-ask').classList.contains('on')) run(); });
})();
</script>
</body>
</html>
