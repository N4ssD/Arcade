[package]
name = "arcade"
version = "2.8.2"
description = "Arcade - lanceur de jeux"
authors = ["N4ssD"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
mslnk = "0.1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
