name: Arcade Rust (Tauri)
permissions:
  contents: write
on:
  push:
    paths: ['rust/**', 'app/ui/**', '.github/workflows/rust.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Renommer en Arcade.exe
        shell: bash
        run: cp rust/target/release/arcade.exe Arcade.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Arcade
          path: Arcade.exe
      - name: Publier la dernière version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rust-latest --yes --cleanup-tag || true
          gh release delete dernier --yes --cleanup-tag || true
          gh release create dernier Arcade.exe --prerelease --title "Arcade (dernière version)" --notes "Télécharge Arcade.exe, lance-le et choisis où l'installer."
