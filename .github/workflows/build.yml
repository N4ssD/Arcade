name: Build Arcade
permissions:
  contents: write
on:
  push:
    paths: ['src-tauri/**', 'ui/**', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Name the file ArcadeSetup.exe
        shell: bash
        run: cp src-tauri/target/release/arcade.exe ArcadeSetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeSetup
          path: ArcadeSetup.exe
      - name: Publish the latest build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rust-latest --yes --cleanup-tag || true
          gh release delete dernier --yes --cleanup-tag || true
          VER=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          gh release create dernier ArcadeSetup.exe --prerelease --title "Arcade $VER (latest build)" --notes "Download ArcadeSetup.exe, run it and choose where to install. Windows 10 or 11, 64-bit. See the README for details."
